apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-itex-eoms
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-itex-eoms
  template:
    metadata:
      labels:
        app: klinx-itex-eoms
    spec:
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 20
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 20
      terminationGracePeriodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - klinx-itex-eoms
                topologyKey: kubernetes.io/hostname
      containers:
        - name: klinx-itex-eoms
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-itex-eoms:private_jingyuan_qa
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: tcp-80
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 120
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      initContainers:
        - name: init
          image: busybox:latest
          command:
            - sh
          args:
            - '-c'
            - until nc -vz klinx-openapi-server 8712;do echo waiting for gateway;sleep 2;done
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "25%"
      maxSurge: "25%"
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-itex-eoms
  namespace: saas
spec:
  type: NodePort
  selector:
    app: klinx-itex-eoms
  ports:
    - name: tcp-80
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31313