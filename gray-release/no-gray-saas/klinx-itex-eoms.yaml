apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-itex-eoms
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-itex-eoms
  template:
    metadata:
      labels:
        app: klinx-itex-eoms
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - klinx-itex-eoms
                topologyKey: kubernetes.io/hostname
      containers:
        - name: klinx-itex-eoms
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-itex-eoms:private_jingyuan_qa
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http-80
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 120
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      initContainers:
        - name: init
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - until nc -vz klinx-openapi-server 8712;do echo waiting for gateway;sleep 2;done
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-itex-eoms
  namespace: saas
spec:
  type: NodePort
  selector:
    app: klinx-itex-eoms
  ports:
    - name: http-80
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31313