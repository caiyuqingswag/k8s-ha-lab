apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-itpm-server-v2
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-itpm-server
      version: v2
  template:
    metadata:
      labels:
        app: klinx-itpm-server
        version: v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - klinx-itpm-server
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: init
          image: busybox:1.36
          command:
            - sh
          args:
            - "-c"
            - until nc -vz klinx-iccs-server 8707; do echo waiting for ccs; sleep 2; done
      containers:
        - name: klinx-itpm-server
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-itpm-server:REPLACE_WITH_V2_TAG
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=85.0"
            - name: DISCOVERY_PORT
              value: "8716"
            - name: SERVER_PORT
              value: "8716"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3072Mi
          ports:
            - name: http-8716
              containerPort: 8716
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8716
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8716
              scheme: HTTP
            initialDelaySeconds: 6
            timeoutSeconds: 1
            periodSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8716
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 40
      