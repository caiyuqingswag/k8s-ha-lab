apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-gateway-server-v2
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-gateway-server
      version: v2
  template:
    metadata:
      labels:
        app: klinx-gateway-server
        version: v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - klinx-gateway-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: klinx-gateway-server
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-gateway-server:REPLACE_WITH_V2_TAG
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: saas-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4096Mi
          ports:
            - name: http-8760
              containerPort: 8760
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8760
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8760
              scheme: HTTP
            initialDelaySeconds: 6
            timeoutSeconds: 1
            periodSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8760
              scheme: HTTP
            initialDelaySeconds: 6
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 30
      initContainers:
        - name: init
          image: busybox:1.36
          command:
            - sh
          args:
            - "-c"
            - until nc -vz klinx-datacollect-server 8702; do echo waiting for base; sleep 2; done
      