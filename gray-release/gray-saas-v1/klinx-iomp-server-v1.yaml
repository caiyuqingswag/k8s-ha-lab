apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-iomp-server-v1
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-iomp-server
      version: v1
  template:
    metadata:
      labels:
        app: klinx-iomp-server
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 20
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 20
      terminationGracePeriodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - klinx-iomp-server
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: init
          image: busybox:latest
          command:
            - sh
          args:
            - "-c"
            - until nc -vz klinx-gateway-server 8760; do echo waiting for base; sleep 2; done
      containers:
        - name: klinx-iomp-server
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-iomp-server:private_jingyuan_qa_sit
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: tcp-8711
              containerPort: 8711
              protocol: TCP
          envFrom:
            - configMapRef:
                name: saas-config
          resources:
            limits:
              cpu: "1"
              memory: 3Gi
            requests:
              cpu: 300m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8711
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8711
              scheme: HTTP
            initialDelaySeconds: 6
            timeoutSeconds: 1
            periodSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8711
              scheme: HTTP
            initialDelaySeconds: 6
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 60
      restartPolicy: Always
      dnsPolicy: ClusterFirst