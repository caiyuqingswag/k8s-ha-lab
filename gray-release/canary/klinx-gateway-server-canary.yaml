apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: klinx-gateway-server
  namespace: saas
spec:
  hosts:
    - klinx-gateway-server
  http:
    - route:
        - destination:
            host: klinx-gateway-server
            subset: v1
          weight: 95
        - destination:
            host: klinx-gateway-server
            subset: v2
          weight: 5