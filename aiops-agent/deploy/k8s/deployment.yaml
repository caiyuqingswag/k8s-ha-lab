apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      serviceAccountName: aiops-agent
      containers:
        - name: aiops-agent
          image: aiops-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18080
          envFrom:
            - configMapRef:
                name: aiops-agent-config
            - secretRef:
                name: aiops-agent-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 18080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 18080
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
