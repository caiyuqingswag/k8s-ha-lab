apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: prod-distributed
  labels:
    app: redis
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: prod-distributed
  labels:
    app: redis
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: redis
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
