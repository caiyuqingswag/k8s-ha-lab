apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: prod-distributed
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: redis
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: render-redis-config
          image: redis:8.8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              cp /config/redis.conf /work/redis.conf
              if [ "$(hostname)" != "redis-0" ]; then
                echo "replicaof redis-0.redis-headless.prod-distributed.svc.cluster.local 6379" >> /work/redis.conf
              fi
              cat > /work/sentinel.conf <<EOF
              port 26379
              bind 0.0.0.0
              protected-mode no
              sentinel monitor mymaster redis-0.redis-headless.prod-distributed.svc.cluster.local 6379 2
              sentinel auth-pass mymaster ${REDIS_PASSWORD}
              sentinel down-after-milliseconds mymaster 10000
              sentinel failover-timeout mymaster 60000
              sentinel parallel-syncs mymaster 1
              EOF
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-config
              mountPath: /config
            - name: work
              mountPath: /work
      containers:
        - name: redis
          image: redis:8.8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - redis-server /work/redis.conf --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
        - name: sentinel
          image: redis:8.8.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - redis-sentinel /work/sentinel.conf
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: sentinel
              containerPort: 26379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: 26379
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 26379
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 26379
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: redis
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-ha
        resources:
          requests:
            storage: 20Gi
