apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-ssd-minio-0
  labels:
    local-pv.k8s-ha-lab/component: minio
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-ssd
  local:
    path: /data/local-pv/prod-distributed/minio-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ssd1
