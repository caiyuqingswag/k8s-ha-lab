apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-ssd-vmstorage-0
  labels:
    local-pv.k8s-ha-lab/component: vmstorage
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-ssd
  local:
    path: /data/local-pv/prod-distributed/vmstorage-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ssd1
