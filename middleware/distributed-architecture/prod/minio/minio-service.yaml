apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: prod-distributed
  labels:
    app: minio
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: prod-distributed
  labels:
    app: minio
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: minio
  ports:
    - name: console
      port: 9001
      targetPort: 9001
