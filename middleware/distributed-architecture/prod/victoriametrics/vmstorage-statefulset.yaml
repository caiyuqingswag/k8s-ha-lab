apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage
  namespace: prod-distributed
  labels:
    app.kubernetes.io/name: vmstorage
    app.kubernetes.io/part-of: victoriametrics
spec:
  serviceName: vmstorage-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vmstorage
      app.kubernetes.io/part-of: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmstorage
        app.kubernetes.io/part-of: victoriametrics
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vmstorage
                  app.kubernetes.io/part-of: victoriametrics
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vmstorage
          image: victoriametrics/vmstorage:v1.145.0-cluster
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=12
            - -httpListenAddr=:8482
            - -vminsertAddr=:8400
            - -vmselectAddr=:8401
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8482
            - name: vminsert
              containerPort: 8400
            - name: vmselect
              containerPort: 8401
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /storage
          startupProbe:
            httpGet:
              path: /health
              port: 8482
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8482
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8482
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: vmstorage
          app.kubernetes.io/part-of: victoriametrics
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-ssd
        selector:
          matchLabels:
            local-pv.k8s-ha-lab/component: vmstorage
        resources:
          requests:
            storage: 100Gi
