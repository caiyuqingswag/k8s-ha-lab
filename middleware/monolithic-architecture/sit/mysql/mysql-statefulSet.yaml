apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: sit-basic
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mysql
                topologyKey: kubernetes.io/hostname
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            # ✅ baseline 下可选：确认没权限问题再打开
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            # ✅ 也可尝试（若报写入问题，再加 /tmp emptyDir；我下面已加了）
            readOnlyRootFilesystem: true
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: mysqld-run
              mountPath: /var/run/mysqld
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-config
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
            # ✅ MySQL 常用临时目录（也为以后开 readOnlyRootFilesystem 做准备）
            - name: tmp
              mountPath: /tmp
          # ✅ 强烈建议加健康检查（避免假活）
          startupProbe:
            exec:
              command: ["bash", "-lc", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["bash", "-lc", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["bash", "-lc", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: mysqld-run
          emptyDir: { }
        - name: mysql-data
          persistentVolumeClaim:
            claimName: pvc-mysql-sit
        - name: mysql-config
          configMap:
            name: mysql-config
        - name: tmp
          emptyDir: {}