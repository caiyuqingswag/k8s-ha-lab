apiVersion: v1
kind: Service
metadata:
  name: mysql-nodeport
  namespace: dev-basic
  labels:
    app: mysql
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 31306