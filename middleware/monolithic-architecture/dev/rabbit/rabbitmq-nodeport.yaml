apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodeport
  namespace: dev-basic
  labels:
    app: rabbitmq
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  sessionAffinity: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30673
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 31673