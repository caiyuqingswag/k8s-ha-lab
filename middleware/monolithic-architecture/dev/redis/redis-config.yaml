apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: dev-basic
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port 6379

    appendonly yes
    appendfsync everysec
    aof-use-rdb-preamble yes
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    no-appendfsync-on-rewrite yes

    save ""

    maxmemory 1gb
    maxmemory-policy allkeys-lru

    tcp-keepalive 300
    tcp-backlog 511
    databases 16
    timeout 0

    slowlog-log-slower-than 10000
    slowlog-max-len 128

    logfile ""
    loglevel notice

    dir /data