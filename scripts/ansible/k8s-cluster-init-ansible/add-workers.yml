- name: Get join command from master1
  hosts: 172.16.15.61
  become: true
  tasks:
    - name: Get join command
      command: kubeadm token create --print-join-command
      register: join_cmd
      changed_when: false

    - name: Save join command
      set_fact:
        join_command_worker: "{{ join_cmd.stdout }}"

- name: Join new workers
  hosts: nodes
  become: true
  tasks:
    - name: Check if already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubeletconf

    - name: Join cluster as worker
      command: "{{ hostvars['172.16.15.61'].join_command_worker }}"
      when: not kubeletconf.stat.exists
