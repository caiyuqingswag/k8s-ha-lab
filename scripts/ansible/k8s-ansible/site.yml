- name: System update and kernel upgrade (parallel)
  hosts: all
  become: true
  strategy: free
  roles:
    - system_update
  tags:
    - update

- name: Generate summary report on control node (txt table)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure report directory exists
      file:
        path: "{{ system_update_report_dir }}"
        state: directory
        mode: "0755"

    - name: Write summary.txt
      template:
        src: roles/system_update/templates/summary.j2
        dest: "{{ system_update_report_dir }}/summary.txt"
        mode: "0644"
  tags:
    - update

- name: Reboot control node last (delayed, so ansible can finish)
  hosts: "{{ system_update_control_host }}"
  become: true
  gather_facts: false
  tasks:
    - name: Schedule delayed reboot on control node if needed
      command: "systemd-run --on-active={{ system_update_control_reboot_delay_seconds | default(60) }}s /usr/sbin/reboot"
      when:
        - system_update_reboot | default(true)
        - reboot_needed | default(false)
  tags:
    - update

- name: Common OS init (all)
  hosts: all
  become: true
  roles:
    - common
  tags: common

- name: Deploy Nginx + Keepalived LB
  hosts: lb_master,lb_backup
  become: true
  roles:
    - lb
  tags: lb

- name: Install containerd (all)
  hosts: all
  become: true
  roles:
    - containerd
  tags: containerd

- name: Install kubelet/kubeadm/kubectl (all)
  hosts: all
  become: true
  roles:
    - kube
  tags: kube

- name: Kubeadm init on master1 and apply Calico
  hosts: "{{ groups['masters'][0] }}"
  serial: 1
  become: true
  tasks:
    - import_role:
        name: kubeadm
        tasks_from: init.yml

    - import_role:
        name: cni
  tags: init

- name: Join other masters (control-plane)
  hosts: masters
  become: true
  serial: 1
  tags: join_masters
  tasks:
    - import_role:
        name: kubeadm
        tasks_from: join_masters.yml

- name: Join workers
  hosts: nodes
  become: true
  serial: 10
  tasks:
    - import_role:
        name: kubeadm
        tasks_from: join_workers.yml
  tags: join_workers
