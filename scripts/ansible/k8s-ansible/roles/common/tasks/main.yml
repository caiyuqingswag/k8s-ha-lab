- name: Set hostname
  hostname:
    name: "{{ hostname }}"

- name: Build hosts file content
  set_fact:
    hosts_block: |
      127.0.0.1   localhost localhost.localdomain localhost4 localhost4.localdomain4
      ::1         localhost localhost.localdomain localhost6 localhost6.localdomain6
      {% for h in groups['masters'] %}
      {{ h }} {{ hostvars[h].hostname }}
      {% endfor %}
      {% for h in groups['nodes'] %}
      {{ h }} {{ hostvars[h].hostname }}
      {% endfor %}

- name: Update /etc/hosts
  copy:
    dest: /etc/hosts
    content: "{{ hosts_block }}"
    mode: "0644"

- name: Install base packages (nftables-only, no IPVS)
  dnf:
    name:
      - device-mapper-persistent-data
      - lvm2
      - wget
      - net-tools
      - nfs-utils
      - curl
      - unzip
      - sudo
      - vim
      - bash-completion
      - conntrack-tools
      - socat
      - chrony
      - yum-utils
      - nftables
      - tar
    state: present

- name: Disable SELinux runtime
  command: setenforce 0
  failed_when: false
  changed_when: false

- name: Disable SELinux config
  lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=disabled'

- name: Disable swap runtime
  command: swapoff -a
  failed_when: false
  changed_when: false

- name: Comment swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^(\s*[^#].*\s+swap\s+.*)$'
    replace: '#\1'

- name: Disable firewalld
  systemd:
    name: firewalld
    enabled: false
    state: stopped
  failed_when: false

- name: Configure kernel modules (no IPVS)
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      bridge
      br_netfilter
      nf_conntrack
    mode: "0644"

- name: Load modules now
  command: modprobe {{ item }}
  loop:
    - br_netfilter
    - nf_conntrack
  failed_when: false
  changed_when: false


- name: Persist nf_conntrack hashsize
  copy:
    dest: /etc/modprobe.d/nf_conntrack.conf
    content: |
      options nf_conntrack hashsize=65536
    mode: "0644"

- name: Configure sysctl (Kubernetes tuning, nftables)
  copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                = 1
      net.netfilter.nf_conntrack_max = 262144
      net.core.somaxconn = 32768
      net.core.netdev_max_backlog = 16384
      net.ipv4.tcp_tw_reuse = 1
      net.ipv4.tcp_fin_timeout = 15
      net.ipv4.tcp_keepalive_time = 600
      net.ipv4.tcp_keepalive_intvl = 30
      net.ipv4.tcp_keepalive_probes = 10
      fs.file-max = 2097152
      fs.inotify.max_user_watches = 1048576
      fs.inotify.max_user_instances = 8192
      vm.max_map_count = 262144
      fs.aio-max-nr = 1048576
    mode: "0644"

- name: Apply sysctl
  command: sysctl --system
  changed_when: false

- name: Configure ulimit
  copy:
    dest: /etc/security/limits.d/90-k8s.conf
    content: |
      * soft nofile 1048576
      * hard nofile 1048576
      root soft nofile 1048576
      root hard nofile 1048576
    mode: "0644"

- name: Ensure systemd drop-in directory exists
  file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Configure systemd limits drop-in
  copy:
    dest: /etc/systemd/system.conf.d/90-k8s-limits.conf
    content: |
      [Manager]
      DefaultLimitNOFILE=1048576
    mode: "0644"

- name: Reload systemd manager
  command: systemctl daemon-reexec
  failed_when: false
  changed_when: false

- name: Configure chrony
  copy:
    dest: /etc/chrony.conf
    content: |
      server ntp1.aliyun.com iburst
      server ntp2.aliyun.com iburst
      server ntp1.tencent.com iburst
      server ntp2.tencent.com iburst
      driftfile /var/lib/chrony/drift
      makestep 1.0 3
      rtcsync
    mode: "0644"

- name: Enable chronyd
  systemd:
    name: chronyd
    enabled: true
    state: started
