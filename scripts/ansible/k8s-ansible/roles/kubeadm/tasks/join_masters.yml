- name: Generate join command
  shell: kubeadm token create --print-join-command
  register: join_cmd
  run_once: true
  when: inventory_hostname == groups['masters'][0]
  tags: join_masters

- name: Upload certs
  shell: kubeadm init phase upload-certs --upload-certs
  register: cert_out
  run_once: true
  when: inventory_hostname == groups['masters'][0]
  tags: join_masters

- name: Save cluster join info
  add_host:
    name: k8s_cluster
    join_command: "{{ join_cmd.stdout }}"
    certificate_key: "{{ cert_out.stdout_lines[-1] }}"
  run_once: true
  when: inventory_hostname == groups['masters'][0]
  tags: join_masters

- name: Check if already joined
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeletconf
  tags: join_masters

- name: Join as control-plane
  command: >
    {{ hostvars['k8s_cluster'].join_command }}
    --control-plane
    --certificate-key {{ hostvars['k8s_cluster'].certificate_key }}
  when:
    - not kubeletconf.stat.exists
    - inventory_hostname != groups['masters'][0]
  tags: join_masters
