- name: Check if already joined
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeletconf
  tags: join_workers

- name: Ensure worker join command is available (fetch from first master if missing)
  block:
    - name: Fetch join command from first master
      command: kubeadm token create --print-join-command
      register: _join_cmd
      changed_when: false
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true

    - name: Publish join info to k8s_cluster
      add_host:
        name: k8s_cluster
        join_command: "{{ _join_cmd.stdout | mandatory }}"
      run_once: true
  when: hostvars['k8s_cluster'] is not defined or hostvars['k8s_cluster'].join_command is not defined
  tags: join_workers

- name: Join worker
  command: "{{ hostvars['k8s_cluster'].join_command | mandatory }}"
  when: not kubeletconf.stat.exists
  tags: join_workers
