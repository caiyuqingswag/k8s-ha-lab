- name: Install containerd
  dnf:
    name: containerd
    state: present

- name: Ensure containerd dirs
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/containerd
    - /etc/containerd/conf.d

- name: Deploy containerd config.toml
  copy:
    src: config.toml
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

- name: Deploy registry mirrors config
  copy:
    src: registry-mirrors.toml
    dest: /etc/containerd/conf.d/registry-mirrors.toml
    mode: "0644"
  notify: Restart containerd

- name: Configure crictl
  copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///var/run/containerd/containerd.sock
      image-endpoint: unix:///var/run/containerd/containerd.sock
      timeout: 10
      debug: false
    mode: "0644"

# journald

- name: Ensure journald drop-in directory exists
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure persistent journal dir exists
  file:
    path: /var/log/journal
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald log rotation
  copy:
    dest: /etc/systemd/journald.conf.d/99-k8s.conf
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
      SystemKeepFree=2G
      SystemMaxFileSize=100M
      MaxRetentionSec=30day
      MaxFileSec=7day
    mode: "0644"
  notify: Restart journald

- name: Enable and start containerd
  systemd:
    name: containerd
    enabled: true
    state: started

handlers:
  - name: Restart containerd
    systemd:
      name: containerd
      state: restarted

  - name: Restart journald
    systemd:
      name: systemd-journald
      state: restarted
