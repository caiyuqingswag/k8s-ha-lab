- name: Skip system update if disabled
  meta: end_host
  when: not (system_update_enabled | default(true))


- name: Mark whether this host is the Ansible control node
  set_fact:
    is_control_node: "{{ inventory_hostname == system_update_control_host }}"

- name: Record kernel before update
  command: uname -r
  register: kernel_before
  changed_when: false

- name: Ensure yum-utils is installed (for needs-restarting)
  dnf:
    name: yum-utils
    state: present

- name: Update all packages (including kernel)
  dnf:
    name: "*"
    state: latest
    update_cache: true

- name: Check if reboot is required (needs-restarting -r)
  command: needs-restarting -r
  register: reboot_required
  failed_when: false
  changed_when: false
  when: system_update_reboot_only_if_needed | default(true)

- name: Decide reboot_needed flag
  set_fact:
    reboot_needed: >-
      {{
        (not (system_update_reboot_only_if_needed | default(true))) or
        (reboot_required is defined and reboot_required.rc != 0)
      }}

- name: Reboot system now (skip control node)
  reboot:
    msg: "Reboot triggered by Ansible after system update"
    connect_timeout: "{{ system_update_connect_timeout }}"
    reboot_timeout: "{{ system_update_reboot_timeout }}"
    pre_reboot_delay: "{{ system_update_pre_delay }}"
    post_reboot_delay: "{{ system_update_post_delay }}"
  when:
    - system_update_reboot
    - reboot_needed
    - not is_control_node

- name: Record kernel after update/reboot (non-control or control not rebooted yet)
  command: uname -r
  register: kernel_after
  changed_when: false

- name: Compute kernel changed
  set_fact:
    kernel_changed: "{{ kernel_before.stdout != kernel_after.stdout }}"

- name: Build per-host report text
  set_fact:
    upgrade_report: |
      Host: {{ inventory_hostname }}
      Kernel before: {{ kernel_before.stdout }}
      Kernel after:  {{ kernel_after.stdout }}
      Kernel changed: {{ 'YES' if kernel_changed else 'NO' }}
      Reboot needed: {{ 'YES' if reboot_needed else 'NO' }}
      Reboot executed now: {{ 'NO (control node)' if is_control_node else ('YES' if (system_update_reboot and reboot_needed) else 'NO') }}
      Time: {{ ansible_date_time.iso8601 }}

- name: Ensure report dir exists on control node
  delegate_to: localhost
  file:
    path: "{{ system_update_report_dir }}"
    state: directory
    mode: "0755"

- name: Save per-host report on control node
  delegate_to: localhost
  copy:
    dest: "{{ system_update_report_dir }}/{{ inventory_hostname }}.txt"
    content: "{{ upgrade_report }}"
    mode: "0644"
