# 是否启用更新
system_update_enabled: true

# 是否执行重启（推荐 true）
system_update_reboot: true

# 是否仅在 needs-restarting 判断需要时才重启
system_update_reboot_only_if_needed: true

# 控制机（ansible 控制端）IP：用于跳过即时 reboot，最后再延迟重启
system_update_control_ip: "172.16.15.51"

# 控制机延迟重启秒数（确保 playbook 能结束并写 summary）
system_update_control_reboot_delay_seconds: 60

# reboot 参数
system_update_reboot_timeout: 1200
system_update_connect_timeout: 5
system_update_pre_delay: 3
system_update_post_delay: 10

# 报告输出目录（在控制机本地）
system_update_report_dir: "./upgrade-reports"
