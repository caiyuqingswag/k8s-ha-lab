apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-base-server
  namespace: saas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: klinx-base-server
  template:
    metadata:
      labels:
        app: klinx-base-server
    spec:
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      terminationGracePeriodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - klinx-base-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: klinx-base-server
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-base-server:private_jingyuan_qa_sit
          envFrom:
            - configMapRef:
                name: saas-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
          ports:
            - name: tcp-8750
              containerPort: 8750
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8750
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8750
              scheme: HTTP
            initialDelaySeconds: 6
            timeoutSeconds: 2
            periodSeconds: 2
            successThreshold: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8750
              scheme: HTTP
            initialDelaySeconds: 6
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-base-server
  namespace: saas
spec:
  type: ClusterIP
  selector:
    app: klinx-base-server
  ports:
    - name: tcp-8750
      port: 8750
      protocol: TCP
      targetPort: 8750