kind: Deployment
apiVersion: apps/v1
metadata:
  name: klinx-iomp-server
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-iomp-server
  template:
    metadata:
      labels:
        app: klinx-iomp-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: klinx-iomp-server
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-iomp-server:private_jingyuan_qa_sit
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: root-logs
              mountPath: /root/logs
            - name: app-logs
              mountPath: /Users/texpro/data/projects/logs/klinx-iomp-server
            - name: heapdump
              mountPath: /heapdump
          ports:
            - name: tcp-8711
              containerPort: 8711
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: saas-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8711
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8711
              scheme: HTTP
            initialDelaySeconds: 6
            periodSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8711
              scheme: HTTP
            initialDelaySeconds: 6
            periodSeconds: 6
            failureThreshold: 60
      restartPolicy: Always
      schedulerName: default-scheduler
      volumes:
        - name: tmp
          emptyDir: { }
        - name: root-logs
          emptyDir: { }
        - name: app-logs
          emptyDir: { }
        - name: heapdump
          persistentVolumeClaim:
            claimName: heapdump-pvc      
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-iomp-server
  namespace: saas
spec:
  type: ClusterIP
  selector:
    app: klinx-iomp-server
  ports:
    - name: tcp-8711
      port: 8711
      protocol: TCP
      targetPort: 8711