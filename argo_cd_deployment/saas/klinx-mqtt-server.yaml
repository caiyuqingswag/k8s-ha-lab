apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-mqtt-broker
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-mqtt-broker
  template:
    metadata:
      labels:
        app: klinx-mqtt-broker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: klinx-mqtt-broker
          image: node5:443/itex-biz/klinx-mqtt-broker:private_newha
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: saas-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4096Mi
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9088
              scheme: HTTP
            periodSeconds: 6
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9088
              scheme: HTTP
            periodSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9088
              scheme: HTTP
            initialDelaySeconds: 6
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: root-logs
              mountPath: /root/logs
            - name: app-logs
              mountPath: /logs
            - name: heapdump
              mountPath: /heapdump
          ports:
            - name: tcp-18255
              containerPort: 18255
              protocol: TCP
      initContainers:
        - name: init-nacos
          image: busybox:1.36
          imagePullPolicy: Always
          command:
            - sh
          args:
            - '-c'
            - until nc -vz klinx-job-admin-0.job-headless:7767;do echo waiting for nacos;sleep 2;done
      volumes:
        - name: tmp
          emptyDir: { }
        - name: root-logs
          emptyDir: { }
        - name: app-logs
          emptyDir: { }
        - name: heapdump
          persistentVolumeClaim:
            claimName: heapdump-pvc      
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-mqtt-broker
  namespace: saas
spec:
  type: NodePort
  selector:
    app: klinx-mqtt-broker
  ports:
    - name: tcp-18255
      port: 18255
      protocol: TCP
      targetPort: 18255
      nodePort: 30693