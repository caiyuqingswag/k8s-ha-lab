apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-mqtt-broker
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-mqtt-broker
  template:
    metadata:
      labels:
        app: klinx-mqtt-broker
    spec:
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      terminationGracePeriodSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - klinx-mqtt-broker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: klinx-mqtt-broker
          image: node5:443/itex-biz/klinx-mqtt-broker:private_newha
          envFrom:
            - configMapRef:
                name: saas-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4096Mi
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9088
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9088
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9088
              scheme: HTTP
            timeoutSeconds: 1
            successThreshold: 1
            initialDelaySeconds: 6
            failureThreshold: 30
            periodSeconds: 10
          ports:
            - name: tcp-18255
              containerPort: 18255
              protocol: TCP
      initContainers:
        - name: init-nacos
          image: busybox:1.36
          imagePullPolicy: Always
          command:
            - sh
          args:
            - '-c'
            - until nc -vz klinx-job-admin-0.job-headless:7767;do echo waiting for nacos;sleep 2;done
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: klinx-mqtt-broker
  namespace: saas
spec:
  type: NodePort
  selector:
    app: klinx-mqtt-broker
  ports:
    - name: tcp-18255
      port: 18255
      protocol: TCP
      targetPort: 18255
      nodePort: 30693