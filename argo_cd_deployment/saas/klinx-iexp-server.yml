kind: Deployment
apiVersion: apps/v1
metadata:
  name: klinx-iexpert-server
  namespace: saas
  labels:
    app: klinx-iexpert-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-iexpert-server
  template:
    metadata:
      labels:
        app: klinx-iexpert-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: klinx-iexpert-server
          image: node5:443/itex-biz/klinx-iexpert-server:private_jingyuan_qa_sit
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: saas-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: root-logs
              mountPath: /root/logs
            - name: app-logs
              mountPath: /Users/texpro/data/projects/logs/klinx-iexpert-server
            - name: heapdump
              mountPath: /heapdump
          ports:
            - containerPort: 7070
              protocol: TCP
            - containerPort: 8717
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8717
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 6
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8717
              scheme: HTTP
            initialDelaySeconds: 6
            periodSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8717
              scheme: HTTP
            initialDelaySeconds: 6
            failureThreshold: 30
            periodSeconds: 10
          env:
            - name: DISCOVERY_PORT
              value: "8717"               # 提供给 ${DISCOVERY_PORT}
            - name: SERVER_PORT
              value: "8717"               # 如果配置里用了 ${server.port}
          resources:
            limits:
              cpu: '1'
              memory: 1800Mi
            requests:
              cpu: 300m
              memory: 512Mi
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      schedulerName: default-scheduler
      volumes:
        - name: tmp
          emptyDir: { }
        - name: root-logs
          emptyDir: { }
        - name: app-logs
          emptyDir: { }
        - name: heapdump
          persistentVolumeClaim:
            claimName: heapdump-pvc      
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  minReadySeconds: 10
---
kind: Service
apiVersion: v1
metadata:
  name: klinx-iexpert-server
  namespace: saas
  labels:
    app: klinx-iexpert-server
spec:
  ports:
    - name: http-7070
      protocol: TCP
      port: 7070
      targetPort: 7070
    - name: http-8717
      protocol: TCP
      port: 8717
      targetPort: 8717
  selector:
    app: klinx-iexpert-server
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster