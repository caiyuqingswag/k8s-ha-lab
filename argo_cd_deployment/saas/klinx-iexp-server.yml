kind: Deployment
apiVersion: apps/v1
metadata:
  name: klinx-iexpert-server
  namespace: saas
  labels:
    app: klinx-iexpert-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-iexpert-server
  template:
    metadata:
      labels:
        app: klinx-iexpert-server
    spec:
      containers:
        - name: klinx-iexpert-server
          image: node5:443/itex-biz/klinx-iexpert-server:private_jingyuan_qa_sit
          ports:
            - containerPort: 7070
              protocol: TCP
            - containerPort: 8717
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8717
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8717
              scheme: HTTP
            initialDelaySeconds: 6
            timeoutSeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8717
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 30
          env:
            - name: DISCOVERY_PORT
              value: "8717"               # 提供给 ${DISCOVERY_PORT}
            - name: SERVER_PORT
              value: "8717"               # 如果配置里用了 ${server.port}
            - name: JAVA_OPTS
              value: '-XX:MaxRAMPercentage=90.0'
          resources:
            limits:
              cpu: '1'
              memory: 1800Mi
            requests:
              cpu: 300m
              memory: 512Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  minReadySeconds: 10
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
kind: Service
apiVersion: v1
metadata:
  name: klinx-iexpert-server
  namespace: saas
  labels:
    app: klinx-iexpert-server
spec:
  ports:
    - name: http-7070
      protocol: TCP
      port: 7070
      targetPort: 7070
    - name: http-8717
      protocol: TCP
      port: 8717
      targetPort: 8717
  selector:
    app: klinx-iexpert-server
  type: ClusterIP
  sessionAffinity: None
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  internalTrafficPolicy: Cluster