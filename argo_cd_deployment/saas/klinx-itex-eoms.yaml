apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-itex-eoms
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-itex-eoms
  template:
    metadata:
      labels:
        app: klinx-itex-eoms
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: klinx-itex-eoms
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-itex-eoms:private_jingyuan_qa
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: tcp-80
              containerPort: 80
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 6
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 0
            periodSeconds: 3
            failureThreshold: 3
      initContainers:
        - name: init
          image: busybox:1.36
          command:
            - sh
          args:
            - '-c'
            - until nc -vz klinx-openapi-server 8712;do echo waiting for gateway;sleep 2;done
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-itex-eoms
  namespace: saas
spec:
  type: NodePort
  selector:
    app: klinx-itex-eoms
  ports:
    - name: tcp-80
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: 31313