apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-iwms-server
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-iwms-server
  template:
    metadata:
      labels:
        app: klinx-iwms-server
    spec:
      containers:
        - name: klinx-iwms-server
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-iwms-server:private_jingyuan_qa_sit
          envFrom:
            - configMapRef:
                name: saas-config
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 6144Mi
          ports:
            - name: tcp-8706
              containerPort: 8706
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 8706
            initialDelaySeconds: 60
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 20
          readinessProbe:
            tcpSocket:
              port: 8706
            timeoutSeconds: 1
            successThreshold: 1
            initialDelaySeconds: 6
            failureThreshold: 30
            periodSeconds: 10
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-iwms-server
  namespace: saas
spec:
  type: ClusterIP
  selector:
    app: klinx-iwms-server
  ports:
    - name: tcp-8706
      port: 8706
      protocol: TCP
      targetPort: 8706