apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinx-iwms-server
  namespace: saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klinx-iwms-server
  template:
    metadata:
      labels:
        app: klinx-iwms-server
    spec:
      containers:
        - name: klinx-iwms-server
          imagePullPolicy: Always
          image: node5:443/itex-biz/klinx-iwms-server:private_jingyuan_qa_sit
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=85.0
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 6144Mi
          ports:
            - name: tcp-8706
              containerPort: 8706
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 8706
            initialDelaySeconds: 60
            timeoutSeconds: 1
            periodSeconds: 6
            successThreshold: 1
            failureThreshold: 20
          readinessProbe:
            tcpSocket:
              port: 8706
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
      initContainers:
        - name: init
          image: busybox:latest
          command:
            - sh
          args:
            - '-c'
            - until nc -vz klinx-iccs-server 8707;do echo waiting for ccs;sleep 2;done
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "25%"
      maxSurge: "25%"
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: klinx-iwms-server
  namespace: saas
spec:
  type: ClusterIP
  selector:
    app: klinx-iwms-server
  ports:
    - name: tcp-8706
      port: 8706
      protocol: TCP
      targetPort: 8706