apiVersion: apps/v1
kind: Deployment
metadata:
  name: msg-server
  namespace: paas-components
  labels:
    app: msg-server
    version: private
spec:
  selector:
    matchLabels:
      app: msg-server
      version: private
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: msg-server
        version: private
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
    spec:
      containers:
        - name: msg-server
          image: node5:443/ipaas-app/msg-server:private
          ports:
            - protocol: TCP
              containerPort: 7070
            - name: wsport
              protocol: TCP
              containerPort: 8086
            - protocol: TCP
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: paas-config
          env:
            - name: APP_MODE
              value: private
            - name: APP_VERSION
              value: private
          resources:
            requests:
              cpu: 300m
              memory: 1000Mi
            limits:
              cpu: 1000m
              memory: 2500Mi
      imagePullSecrets:
        - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: msg-server
  namespace: paas-components
  labels:
    app: msg-server
    version: private
spec:
  sessionAffinity: None
  type: ClusterIP
  selector:
    app: msg-server
  ports:
    - name: http-7070
      port: 7070
      protocol: TCP
      targetPort: 7070
    - name: wsport
      protocol: TCP
      port: 8086
      targetPort: 8086
    - name: http-8085
      port: 8085
      protocol: TCP
      targetPort: 8085
---
kind: Service
apiVersion: v1
metadata:
  name: msg-server-test
  namespace: paas-components
  labels:
    app: msg-server
    version: private
spec:
  ports:
    - name: wsport
      protocol: TCP
      port: 8086
      targetPort: 8086
      nodePort: 30086
    - name: http-8085
      protocol: TCP
      port: 8085
      targetPort: 8085
      nodePort: 30085
  selector:
    app: msg-server
  type: NodePort
  sessionAffinity: None