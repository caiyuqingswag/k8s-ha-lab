apiVersion: apps/v1
kind: Deployment
metadata:
  name: openapi
  namespace: paas-components
  labels:
    app: openapi
    version: private
spec:
  selector:
    matchLabels:
      app: openapi
      version: private
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: openapi
        version: private
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
    spec:
      containers:
        - name: openapi
          image: node5:443/ipaas-biz/openapi:private
          ports:
            - protocol: TCP
              containerPort: 7070
            - protocol: TCP
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: paas-config
          env:
            - name: APP_MODE
              value: private
            - name: APP_VERSION
              value: private
          resources:
            requests:
              cpu: 300m
              memory: 1000Mi
            limits:
              cpu: 1000m
              memory: 2500Mi
      imagePullSecrets:
        - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: openapi
  namespace: paas-components
  labels:
    app: openapi
    version: private
spec:
  sessionAffinity: None
  type: ClusterIP
  selector:
    app: openapi
  ports:
    - name: http-7070
      port: 7070
      protocol: TCP
      targetPort: 7070
    - name: http-8090
      port: 8090
      protocol: TCP
      targetPort: 8090

---
kind: Service
apiVersion: v1
metadata:
  name: openapi-test
  namespace: paas-components
  labels:
    app: openapi
    version: private
spec:
  ports:
    - name: http-8090
      protocol: TCP
      port: 8090
      targetPort: 8090
      nodePort: 30090
  selector:
    app: openapi
  type: NodePort
  sessionAffinity: None