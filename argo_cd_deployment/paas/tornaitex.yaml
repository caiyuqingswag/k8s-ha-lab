apiVersion: apps/v1
kind: Deployment
metadata:
  name: tornaitex
  namespace: paas-components
  labels:
    app: tornaitex
    version: private
spec:
  selector:
    matchLabels:
      app: tornaitex
      version: private
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tornaitex
        version: private
    spec:
      containers:
        - name: tornaitex
          image: node5:443/ipaas-devops/tornaitex:private
          ports:
            - protocol: TCP
              containerPort: 7070
            - protocol: TCP
              containerPort: 7700
          envFrom:
            - configMapRef:
                name: paas-config
          env:
            - name: APP_MODE
              value: private
            - name: APP_VERSION
              value: private
          resources:
            requests:
              cpu: 300m
              memory: 1000Mi
            limits:
              cpu: 1000m
              memory: 2500Mi
      imagePullSecrets:
        - name: harbor-secret
---
apiVersion: v1
kind: Service
metadata:
  name: tornaitex
  namespace: paas-components
  labels:
    app: tornaitex
    version: private
spec:
  sessionAffinity: None
  type: ClusterIP
  selector:
    app: tornaitex
  ports:
    - name: http-7070
      port: 7070
      protocol: TCP
      targetPort: 7070
    - name: http-7700
      port: 7700
      protocol: TCP
      targetPort: 7700