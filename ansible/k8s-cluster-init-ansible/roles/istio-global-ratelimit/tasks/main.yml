---
# =========================
# Apply Istio global rate limit
# Run from first master only
# =========================

- name: Ensure this role runs with cluster access
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "masters group is required."

- name: Ensure Istio global ratelimit work directory exists
  ansible.builtin.file:
    path: "{{ istio_global_ratelimit_work_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Render Istio global ratelimit manifests
  ansible.builtin.template:
    src: global-ratelimit.yaml.j2
    dest: "{{ istio_global_ratelimit_work_dir }}/global-ratelimit.yaml"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Check EnvoyFilter CRD exists
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - crd
      - envoyfilters.networking.istio.io
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Apply Istio global ratelimit manifests
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - -f
      - "{{ istio_global_ratelimit_work_dir }}/global-ratelimit.yaml"
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Wait for Redis deployment
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ istio_global_ratelimit_namespace }}"
      - rollout
      - status
      - deploy/{{ istio_global_ratelimit_redis_name }}
      - --timeout=5m
  changed_when: false
  when:
    - inventory_hostname == groups['masters'][0]
    - istio_global_ratelimit_redis_enabled | bool

- name: Wait for ratelimit deployment
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ istio_global_ratelimit_namespace }}"
      - rollout
      - status
      - deploy/{{ istio_global_ratelimit_service_name }}
      - --timeout=5m
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Show global ratelimit pods
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ istio_global_ratelimit_namespace }}"
      - get
      - pods
      - -o
      - wide
  register: istio_global_ratelimit_pods
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print global ratelimit pods
  ansible.builtin.debug:
    msg: "{{ istio_global_ratelimit_pods.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]

- name: Show global ratelimit EnvoyFilters
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - envoyfilter
      - -A
  register: istio_global_ratelimit_envoyfilters
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print global ratelimit EnvoyFilters
  ansible.builtin.debug:
    msg: "{{ istio_global_ratelimit_envoyfilters.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]

- name: Print rendered manifest path
  ansible.builtin.debug:
    msg: "Rendered file: {{ istio_global_ratelimit_work_dir }}/global-ratelimit.yaml"
  when: inventory_hostname == groups['masters'][0]
