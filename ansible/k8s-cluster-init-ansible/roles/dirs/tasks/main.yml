- name: Create directories
  file:
    path: "{{ dir_base }}/{{ item.0 }}/{{ item.1 }}"
    state: directory
    mode: "0755"
  loop: "{{ dir_envs | product(dir_components.keys()) | list }}"

- name: Set ownership for directories
  file:
    path: "{{ dir_base }}/{{ item.0 }}/{{ item.1 }}"
    owner: "{{ dir_components[item.1] }}"
    group: "{{ dir_components[item.1] }}"
    recurse: true
  loop: "{{ dir_envs | product(dir_components.keys()) | list }}"

- name: Show directory structure
  command: tree -d {{ dir_base }}
  register: dir_tree
  changed_when: false
  failed_when: false

- debug:
    msg: "{{ dir_tree.stdout_lines | default([]) }}"
