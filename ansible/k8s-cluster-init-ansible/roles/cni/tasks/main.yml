- name: Ensure kube-system namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: kube-system
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
  when: inventory_hostname == groups['masters'][0]

- name: Copy Cilium Helm chart to control-plane
  copy:
    src: cilium-{{ cilium_version }}.tgz
    dest: /root/cilium-{{ cilium_version }}.tgz
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Install Cilium via Helm (kube-proxy replacement = strict)
  command: >
    helm upgrade --install cilium
    /root/cilium-{{ cilium_version }}.tgz
    --namespace {{ cilium_namespace }}
    --kubeconfig /etc/kubernetes/admin.conf
    --set kubeProxyReplacement={{ cilium_kubeproxy_replacement }}
    --set ipam.mode=kubernetes
    --set k8sServiceHost={{ k8s_service_host }}
    --set k8sServicePort={{ k8s_service_port }}
  when: inventory_hostname == groups['masters'][0]
