- name: Check if kube-system namespace exists
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - ns
      - kube-system
  register: ns_check
  changed_when: false
  failed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Create kube-system namespace if missing
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - create
      - ns
      - kube-system
  when:
    - inventory_hostname == groups['masters'][0]
    - ns_check.rc != 0

- name: Ensure Cilium working directory exists
  ansible.builtin.file:
    path: /etc/kubernetes/cilium
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Copy Cilium Helm chart to control-plane
  ansible.builtin.copy:
    src: cilium-{{ cilium_version }}.tgz
    dest: /etc/kubernetes/cilium/cilium-{{ cilium_version }}.tgz
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Render Cilium values.yaml
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: /etc/kubernetes/cilium/values.yaml
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Install or upgrade Cilium via Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cilium
      - /etc/kubernetes/cilium/cilium-{{ cilium_version }}.tgz
      - --namespace
      - "{{ cilium_namespace }}"
      - --create-namespace
      - -f
      - /etc/kubernetes/cilium/values.yaml
      - --reset-values
      - --kubeconfig
      - /etc/kubernetes/admin.conf
  when: inventory_hostname == groups['masters'][0]
