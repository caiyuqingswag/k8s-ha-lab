---
# =========================
# Apply APISIXRoute for internal platform UIs
# Run from first master only
# =========================

- name: Ensure this role runs with cluster access
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "masters group is required."

- name: Ensure APISIX internal routes working directory exists
  ansible.builtin.file:
    path: "{{ apisix_routes_internal_work_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Render APISIX internal routes
  ansible.builtin.template:
    src: apisix-routes-internal.yaml.j2
    dest: "{{ apisix_routes_internal_work_dir }}/apisix-routes-internal.yaml"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Check kube-apiserver is reachable
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - --raw=/readyz
  register: apiserver_ready
  changed_when: false
  retries: 30
  delay: 5
  until: apiserver_ready.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Verify APISIXRoute CRD exists
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - crd
      - apisixroutes.apisix.apache.org
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Apply APISIX internal routes
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - -f
      - "{{ apisix_routes_internal_work_dir }}/apisix-routes-internal.yaml"
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Show internal APISIX routes
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - apisixroute
      - -A
      - -o
      - wide
  register: apisix_internal_routes_result
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print internal APISIX routes
  ansible.builtin.debug:
    msg: "{{ apisix_internal_routes_result.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]
