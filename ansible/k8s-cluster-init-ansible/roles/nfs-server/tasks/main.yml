- name: Install NFS server packages
  package:
    name: nfs-utils
    state: present

- name: Ensure NFS shared directory exists
  file:
    path: "{{ nfs_dir }}"
    state: directory
    mode: "0777"

- name: Configure /etc/exports
  lineinfile:
    path: /etc/exports
    line: "{{ nfs_dir }} *({{ nfs_export_opts | trim }})"
    create: yes
  notify: Reload NFS exports

- name: Enable and start NFS server
  systemd:
    name: nfs-server
    enabled: true
    state: started

- name: Show current NFS exports
  command: exportfs -v
  register: nfs_exports
  changed_when: false

- debug:
    var: nfs_exports.stdout_lines
