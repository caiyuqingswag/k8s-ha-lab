---
# =========================
# Install Kyverno by offline Helm chart
# Run Helm operations from first master only
# =========================

- name: Ensure this role runs with cluster access
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "masters group is required."

- name: Ensure Kyverno working directory exists
  ansible.builtin.file:
    path: "{{ kyverno_work_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Copy Kyverno Helm chart to first master
  ansible.builtin.copy:
    src: "{{ kyverno_chart_archive }}"
    dest: "{{ kyverno_work_dir }}/{{ kyverno_chart_archive }}"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Render Kyverno values.yaml
  ansible.builtin.template:
    src: kyverno-values.yaml.j2
    dest: "{{ kyverno_work_dir }}/values.yaml"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Check kube-apiserver is reachable
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - --raw=/readyz
  register: apiserver_ready
  changed_when: false
  retries: 30
  delay: 5
  until: apiserver_ready.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Create Kyverno namespace
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - create
      - namespace
      - "{{ kyverno_namespace }}"
  register: kyverno_ns_create
  failed_when:
    - kyverno_ns_create.rc != 0
    - "'AlreadyExists' not in kyverno_ns_create.stderr"
  changed_when: kyverno_ns_create.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Install or upgrade Kyverno via Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - kyverno
      - "{{ kyverno_work_dir }}/{{ kyverno_chart_archive }}"
      - --namespace
      - "{{ kyverno_namespace }}"
      - --create-namespace
      - -f
      - "{{ kyverno_work_dir }}/values.yaml"
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --timeout
      - "{{ kyverno_helm_timeout }}"
      - --wait
  register: kyverno_helm_result
  changed_when: "'has been upgraded' in kyverno_helm_result.stdout or 'has been installed' in kyverno_helm_result.stdout"
  when: inventory_hostname == groups['masters'][0]

- name: Show Kyverno Helm result
  ansible.builtin.debug:
    msg: "{{ kyverno_helm_result.stdout_lines | default([]) }}"
  when: inventory_hostname == groups['masters'][0]

- name: Wait for Kyverno admission controller
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ kyverno_namespace }}"
      - rollout
      - status
      - deploy/kyverno-admission-controller
      - --timeout=10m
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Wait for Kyverno background controller
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ kyverno_namespace }}"
      - rollout
      - status
      - deploy/kyverno-background-controller
      - --timeout=10m
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Wait for Kyverno cleanup controller
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ kyverno_namespace }}"
      - rollout
      - status
      - deploy/kyverno-cleanup-controller
      - --timeout=10m
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Wait for Kyverno reports controller
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ kyverno_namespace }}"
      - rollout
      - status
      - deploy/kyverno-reports-controller
      - --timeout=10m
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Show Kyverno pods
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ kyverno_namespace }}"
      - get
      - pods
      - -o
      - wide
  register: kyverno_pods
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print Kyverno pods
  ansible.builtin.debug:
    msg: "{{ kyverno_pods.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]

- name: Verify Kyverno CRDs
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - crd
      - clusterpolicies.kyverno.io
  changed_when: false
  when: inventory_hostname == groups['masters'][0]
