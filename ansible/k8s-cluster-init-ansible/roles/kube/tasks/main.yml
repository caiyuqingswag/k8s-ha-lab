---
# =========================
# Kubernetes apt repo - Aliyun
# Kubernetes v1.36.x
# =========================

- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - gpg
      - apt-transport-https
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes GPG key from Aliyun
  ansible.builtin.get_url:
    url: "{{ k8s_apt_repo_base }}/v{{ k8s_minor_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"
    force: true

- name: Add Kubernetes apt repository from Aliyun
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes.asc]
      {{ k8s_apt_repo_base }}/v{{ k8s_minor_version }}/deb/ /
    filename: kubernetes
    state: present
    update_cache: true

# =========================
# Install kubelet / kubeadm / kubectl
# =========================

- name: Install kubelet and kubeadm on all nodes
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}-*"
      - "kubeadm={{ k8s_version }}-*"
    state: present
    lock_timeout: 120

- name: Install kubectl on masters only
  ansible.builtin.apt:
    name: "kubectl={{ k8s_version }}-*"
    state: present
    lock_timeout: 120
  when: "'masters' in group_names"

# =========================
# Hold versions
# =========================

- name: Hold kubelet and kubeadm
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm

- name: Hold kubectl on masters only
  ansible.builtin.dpkg_selections:
    name: kubectl
    selection: hold
  when: "'masters' in group_names"

# =========================
# Enable kubelet
# kubelet may stay restarting before kubeadm init/join, this is normal
# =========================

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true

# =========================
# Verify versions
# =========================

- name: Verify kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_version_result
  changed_when: false

- name: Verify kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_version_result
  changed_when: false

- name: Verify kubectl version on masters
  ansible.builtin.command: kubectl version --client=true
  register: kubectl_version_result
  changed_when: false
  when: "'masters' in group_names"

- name: Show Kubernetes package versions
  ansible.builtin.debug:
    msg:
      - "{{ kubelet_version_result.stdout }}"
      - "{{ kubeadm_version_result.stdout }}"
      - "{{ kubectl_version_result.stdout | default('kubectl not installed on worker') }}"

# =========================
# Pre-pull images on masters
# =========================

- name: Pre-pull Kubernetes control plane images on masters
  ansible.builtin.command: >
    kubeadm config images pull
    --kubernetes-version=v{{ k8s_version }}
    --image-repository={{ image_repo }}
  when:
    - "'masters' in group_names"
    - kubeadm_prepull_images | default(true)
  changed_when: false