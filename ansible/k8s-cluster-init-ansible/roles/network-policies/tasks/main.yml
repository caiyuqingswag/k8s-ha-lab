---
# =========================
# Apply baseline NetworkPolicies
# Run from first master only
# =========================

- name: Ensure this role runs with cluster access
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "masters group is required."

- name: Ensure network policies working directory exists
  ansible.builtin.file:
    path: "{{ network_policies_work_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Render baseline NetworkPolicies
  ansible.builtin.template:
    src: baseline-network-policies.yaml.j2
    dest: "{{ network_policies_work_dir }}/baseline-network-policies.yaml"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Check kube-apiserver is reachable
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - --raw=/readyz
  register: apiserver_ready
  changed_when: false
  retries: 30
  delay: 5
  until: apiserver_ready.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Ensure target namespaces exist
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - create
      - namespace
      - "{{ item }}"
  loop: "{{ network_policy_target_namespaces }}"
  register: network_policy_ns_create
  failed_when:
    - network_policy_ns_create.rc != 0
    - "'AlreadyExists' not in network_policy_ns_create.stderr"
  changed_when: network_policy_ns_create.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Apply baseline NetworkPolicies
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - -f
      - "{{ network_policies_work_dir }}/baseline-network-policies.yaml"
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Show NetworkPolicies
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - networkpolicy
      - -A
  register: network_policies_result
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print NetworkPolicies
  ansible.builtin.debug:
    msg: "{{ network_policies_result.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]
