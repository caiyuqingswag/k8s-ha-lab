---
- name: Ensure bash-completion is installed
  ansible.builtin.package:
    name: bash-completion
    state: present

- name: Ensure bash_completion.d directory exists
  ansible.builtin.file:
    path: /etc/bash_completion.d
    state: directory
    mode: "0755"

- name: Generate kubectl bash completion
  ansible.builtin.command: kubectl completion bash
  register: kubectl_completion
  changed_when: false
  failed_when: false

- name: Install kubectl bash completion
  ansible.builtin.copy:
    dest: /etc/bash_completion.d/kubectl
    content: "{{ kubectl_completion.stdout }}"
    mode: "0644"
  when:
    - kubectl_completion.rc == 0
    - kubectl_completion.stdout | length > 0

- name: Generate helm bash completion
  ansible.builtin.command: helm completion bash
  register: helm_completion
  changed_when: false
  failed_when: false

- name: Install helm bash completion
  ansible.builtin.copy:
    dest: /etc/bash_completion.d/helm
    content: "{{ helm_completion.stdout }}"
    mode: "0644"
  when:
    - helm_completion.rc == 0
    - helm_completion.stdout | length > 0

- name: Generate cilium bash completion
  ansible.builtin.command: cilium completion bash
  register: cilium_completion
  changed_when: false
  failed_when: false

- name: Install cilium bash completion
  ansible.builtin.copy:
    dest: /etc/bash_completion.d/cilium
    content: "{{ cilium_completion.stdout }}"
    mode: "0644"
  when:
    - cilium_completion.rc == 0
    - cilium_completion.stdout | length > 0

- name: Generate hubble bash completion
  ansible.builtin.command: hubble completion bash
  register: hubble_completion
  changed_when: false
  failed_when: false
  when: hubble_cli_enabled | default(false)

- name: Install hubble bash completion
  ansible.builtin.copy:
    dest: /etc/bash_completion.d/hubble
    content: "{{ hubble_completion.stdout }}"
    mode: "0644"
  when:
    - hubble_cli_enabled | default(false)
    - hubble_completion is defined
    - hubble_completion.rc == 0
    - hubble_completion.stdout | length > 0