---
- name: Check if hubble CLI already installed
  ansible.builtin.command: hubble version
  register: hubble_check
  failed_when: false
  changed_when: false

- name: Remove old hubble temp dir
  ansible.builtin.file:
    path: "{{ hubble_tmp_dir }}"
    state: absent
  when: hubble_check.rc != 0

- name: Create temp directory for hubble CLI
  ansible.builtin.file:
    path: "{{ hubble_tmp_dir }}"
    state: directory
    mode: "0755"
  when: hubble_check.rc != 0

- name: Copy Hubble CLI archive to node
  ansible.builtin.copy:
    src: "{{ hubble_cli_archive }}"
    dest: "{{ hubble_tmp_dir }}/{{ hubble_cli_archive }}"
    mode: "0644"
  when: hubble_check.rc != 0

- name: Extract Hubble CLI
  ansible.builtin.unarchive:
    src: "{{ hubble_tmp_dir }}/{{ hubble_cli_archive }}"
    dest: "{{ hubble_tmp_dir }}"
    remote_src: true
  when: hubble_check.rc != 0

- name: Ensure /usr/local/bin exists
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"

- name: Install Hubble CLI binary
  ansible.builtin.copy:
    src: "{{ hubble_tmp_dir }}/hubble"
    dest: /usr/local/bin/hubble
    mode: "0755"
    remote_src: true
  when: hubble_check.rc != 0

- name: Verify Hubble CLI installation
  ansible.builtin.command: hubble version
  register: hubble_version_result
  changed_when: false

- name: Show Hubble CLI version
  ansible.builtin.debug:
    msg: "{{ hubble_version_result.stdout }}"