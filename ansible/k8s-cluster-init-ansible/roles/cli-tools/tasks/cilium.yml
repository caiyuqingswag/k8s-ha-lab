---
- name: Check if cilium CLI already installed
  ansible.builtin.command: cilium version
  register: cilium_check
  failed_when: false
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Remove old /tmp/cilium if exists
  ansible.builtin.file:
    path: /tmp/cilium
    state: absent
  when:
    - inventory_hostname == groups['masters'][0]
    - cilium_check.rc != 0

- name: Create temp directory for cilium CLI
  ansible.builtin.file:
    path: /tmp/cilium
    state: directory
    mode: "0755"
  when:
    - inventory_hostname == groups['masters'][0]
    - cilium_check.rc != 0

- name: Copy Cilium CLI archive to node
  ansible.builtin.copy:
    src: cilium-linux-amd64.tar.gz
    dest: /tmp/cilium/cilium-linux-amd64.tar.gz
    mode: "0644"
  when:
    - inventory_hostname == groups['masters'][0]
    - cilium_check.rc != 0

- name: Extract Cilium CLI
  ansible.builtin.unarchive:
    src: /tmp/cilium/cilium-linux-amd64.tar.gz
    dest: /tmp/cilium
    remote_src: true
  when:
    - inventory_hostname == groups['masters'][0]
    - cilium_check.rc != 0

- name: Ensure /usr/local/bin exists
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"
  when:
    - inventory_hostname == groups['masters'][0]
    - cilium_check.rc != 0

- name: Install Cilium CLI binary
  ansible.builtin.copy:
    src: /tmp/cilium/cilium
    dest: /usr/local/bin/cilium
    mode: "0755"
    remote_src: true
  when:
    - inventory_hostname == groups['masters'][0]
    - cilium_check.rc != 0
