---
- name: Check if helm already installed
  ansible.builtin.command: helm version --short
  register: helm_check
  failed_when: false
  changed_when: false

- name: Remove old helm temp dir
  ansible.builtin.file:
    path: "{{ helm_tmp_dir }}"
    state: absent
  when: helm_check.rc != 0

- name: Create temp dir for helm
  ansible.builtin.file:
    path: "{{ helm_tmp_dir }}"
    state: directory
    mode: "0755"
  when: helm_check.rc != 0

- name: Copy helm archive to node
  ansible.builtin.copy:
    src: "{{ helm_archive }}"
    dest: "{{ helm_tmp_dir }}/{{ helm_archive }}"
    mode: "0644"
  when: helm_check.rc != 0

- name: Extract helm archive
  ansible.builtin.unarchive:
    src: "{{ helm_tmp_dir }}/{{ helm_archive }}"
    dest: "{{ helm_tmp_dir }}"
    remote_src: true
  when: helm_check.rc != 0

- name: Ensure /usr/local/bin exists
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"

- name: Install helm binary
  ansible.builtin.copy:
    src: "{{ helm_tmp_dir }}/linux-amd64/helm"
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true
  when: helm_check.rc != 0

- name: Verify helm installation
  ansible.builtin.command: helm version --short
  register: helm_version_result
  changed_when: false

- name: Show helm version
  ansible.builtin.debug:
    msg: "{{ helm_version_result.stdout }}"