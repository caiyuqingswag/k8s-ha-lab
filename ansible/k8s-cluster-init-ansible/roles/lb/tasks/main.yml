- name: Install epel-release
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install nginx, keepalived, stream module
  ansible.builtin.dnf:
    name:
      - nginx
      - keepalived
      - nginx-mod-stream
    state: present

- name: Deploy nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"

- name: Deploy keepalived.conf
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    mode: "0644"

- name: Deploy check_nginx.sh
  ansible.builtin.copy:
    src: check_nginx.sh
    dest: /etc/keepalived/check_nginx.sh
    mode: "0755"

- name: Reload systemd
  ansible.builtin.command: systemctl daemon-reload
  changed_when: false

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: restarted

- name: Enable and start keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: restarted
