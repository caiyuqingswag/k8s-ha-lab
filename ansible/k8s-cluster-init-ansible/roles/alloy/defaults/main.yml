---
# =========================
# Grafana Alloy
# Logs -> Loki
# Traces -> Tempo
# =========================

alloy_namespace: "logging"

alloy_chart_archive: "alloy-1.8.1.tgz"
alloy_work_dir: "/etc/kubernetes/alloy"

# =========================
# Logs -> Loki
# =========================

# Loki 地址
alloy_loki_push_url: "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push"

# 集群标签
alloy_cluster_name: "prod-hz-01"

# 采集哪些 namespace 的日志
alloy_log_namespaces:
  - prod-itex-components
  - prod-itex-servers
  - prod-paas-components
  - prod-srm-components
  - stable-itex-components
  - stable-itex-servers

# DaemonSet 模式建议 true，只采集当前节点上的 Pod 日志
alloy_keep_current_node_only: true

# =========================
# Traces -> Tempo
# =========================

# 是否开启 Trace 接收
alloy_traces_enabled: true

# Alloy 对业务应用暴露的 OTLP 接收端口
alloy_otlp_grpc_port: 4317
alloy_otlp_http_port: 4318

# 给业务应用访问的 Service 名称
# 业务应用以后把 Trace 发到：
# gRPC: alloy-otlp.logging.svc.cluster.local:4317
# HTTP: http://alloy-otlp.logging.svc.cluster.local:4318
alloy_otlp_service_name: "alloy-otlp"

# Tempo OTLP gRPC 地址
alloy_tempo_otlp_endpoint: "tempo.tracing.svc.cluster.local:4317"

# 集群内明文 gRPC，跳过 TLS
alloy_tempo_otlp_tls_insecure: true

# =========================
# Resources
# =========================

alloy_cpu_request: "100m"
alloy_memory_request: "128Mi"
alloy_cpu_limit: "1000m"
alloy_memory_limit: "1Gi"

# =========================
# Helm
# =========================

alloy_helm_timeout: "10m"
