---
alloy_namespace: "logging"

alloy_chart_archive: "alloy-1.8.1.tgz"
alloy_work_dir: "/etc/kubernetes/alloy"

# Loki 地址
# 如果你的 Loki 在 logging namespace，通常是这个
alloy_loki_push_url: "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push"

# 集群标签
alloy_cluster_name: "prod-hz-01"

# 采集哪些 namespace
# 这里先按你原来的业务命名空间来
alloy_log_namespaces:
  - prod-itex-components
  - prod-itex-servers
  - prod-paas-components
  - prod-srm-components
  - stable-itex-components
  - stable-itex-servers

# 是否只采集当前节点上的 Pod 日志
# DaemonSet 模式建议 true
alloy_keep_current_node_only: true

# 资源
alloy_cpu_request: "100m"
alloy_memory_request: "128Mi"
alloy_cpu_limit: "1000m"
alloy_memory_limit: "1Gi"

# Helm
alloy_helm_timeout: "10m"