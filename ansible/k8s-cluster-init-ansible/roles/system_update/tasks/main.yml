---
- name: Skip system update if disabled
  meta: end_host
  when: not (system_update_enabled | default(true))

- name: Mark whether this host is the Ansible control node
  set_fact:
    is_control_node: "{{ inventory_hostname == system_update_control_host }}"

# ===== BEFORE UPDATE SNAPSHOT =====

- name: Record OS version before update
  command: lsb_release -ds
  register: os_before
  changed_when: false

- name: Record kernel before update
  command: uname -r
  register: kernel_before
  changed_when: false

# ===== SYSTEM UPDATE =====

- name: Update apt cache and upgrade packages (including kernel)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: "{{ system_update_apt_upgrade | default('dist') }}"
    lock_timeout: "{{ system_update_pkg_lock_timeout | default(120) }}"
  register: apt_update_result

- name: Autoremove unused packages
  ansible.builtin.apt:
    autoremove: true
    lock_timeout: "{{ system_update_pkg_lock_timeout | default(120) }}"
  when: system_update_apt_autoremove | default(true)

- name: Autoclean apt cache
  ansible.builtin.apt:
    autoclean: true
  when: system_update_apt_autoclean | default(true)

# ===== REBOOT DECISION =====

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  when: system_update_reboot_only_if_needed | default(true)

- name: Decide reboot_needed flag
  set_fact:
    reboot_needed: >-
      {{
        (apt_update_result is defined and (apt_update_result.changed | default(false))) or
        (
          (system_update_reboot_only_if_needed | default(true)) and
          (reboot_required_file is defined and reboot_required_file.stat.exists | default(false))
        )
      }}

# ===== REBOOT =====

- name: Reboot system now (skip control node)
  ansible.builtin.reboot:
    msg: "Reboot triggered by Ansible after system update"
    connect_timeout: "{{ system_update_connect_timeout }}"
    reboot_timeout: "{{ system_update_reboot_timeout }}"
    pre_reboot_delay: "{{ system_update_pre_delay }}"
    post_reboot_delay: "{{ system_update_post_delay }}"
  when:
    - system_update_reboot | default(true)
    - reboot_needed | default(false)
    - not is_control_node

- name: Reboot control node with delay (optional)
  ansible.builtin.reboot:
    msg: "Delayed reboot for Ansible control node after system update"
    connect_timeout: "{{ system_update_connect_timeout }}"
    reboot_timeout: "{{ system_update_reboot_timeout }}"
    pre_reboot_delay: "{{ system_update_control_reboot_delay_seconds }}"
    post_reboot_delay: "{{ system_update_post_delay }}"
  when:
    - system_update_reboot | default(true)
    - reboot_needed | default(false)
    - is_control_node
    - system_update_reboot_control_node | default(false)

# ===== AFTER UPDATE SNAPSHOT =====

- name: Record OS version after update
  command: lsb_release -ds
  register: os_after
  changed_when: false

- name: Record kernel after update/reboot
  command: uname -r
  register: kernel_after
  changed_when: false

# ===== DIFF COMPUTATION =====

- name: Compute OS version changed
  set_fact:
    os_changed: "{{ os_before.stdout != os_after.stdout }}"

- name: Compute kernel changed
  set_fact:
    kernel_changed: "{{ kernel_before.stdout != kernel_after.stdout }}"

# ===== PER-HOST REPORT =====

- name: Build per-host report text
  set_fact:
    upgrade_report: |
      Host: {{ inventory_hostname }}
      OS before: {{ os_before.stdout }}
      OS after:  {{ os_after.stdout }}
      OS changed: {{ 'YES' if os_changed else 'NO' }}
      Kernel before: {{ kernel_before.stdout }}
      Kernel after:  {{ kernel_after.stdout }}
      Kernel changed: {{ 'YES' if kernel_changed else 'NO' }}
      Reboot needed: {{ 'YES' if reboot_needed else 'NO' }}
      Reboot executed now: {{ 'NO (control node)' if is_control_node else ('YES' if (system_update_reboot and reboot_needed) else 'NO') }}
      APT changed: {{ 'YES' if (apt_update_result is defined and (apt_update_result.changed | default(false))) else 'NO' }}
      Time: {{ ansible_date_time.iso8601 }}

# ===== REPORT OUTPUT (CONTROL NODE) =====

- name: Ensure report dir exists on control node
  delegate_to: localhost
  run_once: true
  ansible.builtin.file:
    path: "{{ system_update_report_dir }}"
    state: directory
    mode: "0755"

- name: Save per-host report on control node
  delegate_to: localhost
  ansible.builtin.copy:
    dest: "{{ system_update_report_dir }}/{{ inventory_hostname }}.txt"
    content: "{{ upgrade_report }}"
    mode: "0644"

- name: Save summary report on control node
  delegate_to: localhost
  run_once: true
  ansible.builtin.template:
    src: summary.j2
    dest: "{{ system_update_report_dir }}/SUMMARY.txt"
    mode: "0644"