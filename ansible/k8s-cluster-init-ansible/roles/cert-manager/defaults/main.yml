---
cert_manager_version: "v1.20.2"
cert_manager_chart_archive: "cert-manager-v1.20.2.tgz"

cert_manager_namespace: "cert-manager"
cert_manager_work_dir: "/etc/kubernetes/cert-manager"

cert_manager_install_crds: true
cert_manager_replica_count: 1

cert_manager_prometheus_enabled: true

cert_manager_helm_timeout: "10m"