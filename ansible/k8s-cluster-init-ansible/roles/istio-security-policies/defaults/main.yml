---
# =========================
# Istio Security Policies
# mTLS encryption policies
# =========================

istio_security_policies_work_dir: "/etc/kubernetes/istio-security-policies"

# 默认先 PERMISSIVE，确认所有调用方都注入 sidecar 后再改 STRICT
# PERMISSIVE: 同时接受明文和 mTLS
# STRICT: 只接受 mTLS
istio_mtls_mode: "PERMISSIVE"

# 开启 mTLS 的 namespace
istio_mtls_namespaces:
  - prod-itex-components
  - prod-itex-servers
  - prod-paas-components
  - prod-srm-components
  - stable-itex-components
  - stable-itex-servers

# 是否启用 mesh 全局 mTLS
# 初期建议 false，不要全局一刀切
istio_enable_mesh_wide_mtls: false

# mesh 全局 mTLS 模式
# 只有 istio_enable_mesh_wide_mtls=true 时才生效
istio_mesh_mtls_mode: "PERMISSIVE"

# 是否生成 DestinationRule ISTIO_MUTUAL
# 一般启用，显式告诉客户端 sidecar 使用 Istio mTLS
istio_enable_destination_rules: true

# 需要生成 DestinationRule 的服务
# 后续可以按服务慢慢加，不一定一开始全加
istio_mtls_destination_rules:
  - name: decision-flow-web
    namespace: prod-paas-components
    host: decision-flow-web.prod-paas-components.svc.cluster.local

  - name: order-api
    namespace: prod-itex-servers
    host: order-api.prod-itex-servers.svc.cluster.local

  - name: user-api
    namespace: prod-itex-servers
    host: user-api.prod-itex-servers.svc.cluster.local
