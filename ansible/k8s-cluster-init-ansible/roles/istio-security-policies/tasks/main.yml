---
# =========================
# Apply Istio security policies
# mTLS encryption
# Run from first master only
# =========================

- name: Ensure this role runs with cluster access
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "masters group is required."

- name: Ensure Istio security policies working directory exists
  ansible.builtin.file:
    path: "{{ istio_security_policies_work_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Render Istio mTLS policies
  ansible.builtin.template:
    src: mtls-policies.yaml.j2
    dest: "{{ istio_security_policies_work_dir }}/mtls-policies.yaml"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Check Istio CRDs exist
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - crd
      - peerauthentications.security.istio.io
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Apply Istio mTLS policies
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - -f
      - "{{ istio_security_policies_work_dir }}/mtls-policies.yaml"
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Show PeerAuthentication
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - peerauthentication
      - -A
  register: istio_peerauthentication_result
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print PeerAuthentication
  ansible.builtin.debug:
    msg: "{{ istio_peerauthentication_result.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]

- name: Show mTLS DestinationRules
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - destinationrule
      - -A
  register: istio_mtls_destinationrule_result
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print mTLS DestinationRules
  ansible.builtin.debug:
    msg: "{{ istio_mtls_destinationrule_result.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]
