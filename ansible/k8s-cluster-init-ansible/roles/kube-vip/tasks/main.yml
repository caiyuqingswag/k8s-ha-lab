- name: Ensure /etc/kubernetes/manifests exists
  file:
    path: /etc/kubernetes/manifests
    state: directory
    mode: "0755"

- name: Render kube-vip static pod manifest
  template:
    src: kube-vip.yaml.j2
    dest: /etc/kubernetes/manifests/kube-vip.yaml
    mode: "0644"

# kubelet 会自动拉起 static pod；重启不是必须，但很多环境更稳
- name: Restart kubelet to pick up kube-vip static pod (optional)
  service:
    name: kubelet
    state: restarted
  when: kube_vip_restart_kubelet | default(true)
