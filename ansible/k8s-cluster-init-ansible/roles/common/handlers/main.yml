---
- name: Apply sysctl
  ansible.builtin.command: sysctl --system

- name: Reexec systemd
  ansible.builtin.command: systemctl daemon-reexec

- name: Restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted