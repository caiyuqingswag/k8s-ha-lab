---
# =========================
# Basic identity & hosts
# =========================

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Build hosts block
  set_fact:
    hosts_block: |
      {{ kubevip_api_ip }} {{ kubevip_api_name }}
      {% for h in groups['masters'] %}
      {{ hostvars[h].ansible_host }} {{ h }}
      {% endfor %}
      {% for h in groups['nodes'] %}
      {{ hostvars[h].ansible_host }} {{ h }}
      {% endfor %}

- name: Update /etc/hosts safely
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: "{{ hosts_block }}"
    marker: "# {mark} ANSIBLE K8S HOSTS"

# =========================
# Base packages (Ubuntu)
# =========================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages (Ubuntu 24.04)
  ansible.builtin.apt:
    name:
      - lvm2
      - wget
      - curl
      - unzip
      - sudo
      - vim
      - bash-completion
      - chrony
      - nftables
      - tar
      - iproute2
      - iputils-ping
      - conntrack
      - socat
      - nfs-common
      - ca-certificates
    state: present

# =========================
# Swap (required by Kubernetes)
# =========================

- name: Disable swap runtime
  ansible.builtin.command: swapoff -a
  failed_when: false
  changed_when: false

- name: Comment swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#].*\s+swap\s+.*)$'
    replace: '#\1'

# =========================
# Firewall (Ubuntu uses UFW)
# =========================

- name: Disable ufw (you may enable later)
  ansible.builtin.systemd:
    name: ufw
    enabled: false
    state: stopped
  failed_when: false

# =========================
# Kernel modules for Kubernetes
# =========================

- name: Configure kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
      nf_conntrack
    mode: "0644"

- name: Load kernel modules now
  ansible.builtin.command: modprobe {{ item }}
  loop:
    - overlay
    - br_netfilter
    - nf_conntrack
  failed_when: false
  changed_when: false

# =========================
# Sysctl for Kubernetes
# =========================

- name: Configure sysctl for Kubernetes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1

      net.netfilter.nf_conntrack_max = 262144
      net.core.somaxconn = 16384
      net.core.netdev_max_backlog = 16384

      fs.inotify.max_user_watches = 1048576
      fs.inotify.max_user_instances = 8192

      vm.max_map_count = 262144
    mode: "0644"

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

# =========================
# Limits (ulimit & systemd)
# =========================

- name: Configure ulimit
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-k8s.conf
    content: |
      * soft nofile 262144
      * hard nofile 262144
      root soft nofile 262144
      root hard nofile 262144
    mode: "0644"

- name: Ensure systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Configure systemd limits drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/90-k8s-limits.conf
    content: |
      [Manager]
      DefaultLimitNOFILE=262144
    mode: "0644"

- name: Reload systemd manager
  ansible.builtin.command: systemctl daemon-reexec
  failed_when: false
  changed_when: false

# =========================
# Time sync (chrony)
# =========================

- name: Configure chrony
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    content: |
      server ntp1.aliyun.com iburst
      server ntp2.aliyun.com iburst
      server ntp1.tencent.com iburst
      server ntp2.tencent.com iburst
      driftfile /var/lib/chrony/drift
      makestep 1.0 3
      rtcsync
    mode: "0644"

- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
