---
- name: Ensure this role runs on a master
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "masters group is required."

- name: Ensure JumpServer working directory exists
  ansible.builtin.file:
    path: "{{ jumpserver_work_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Copy JumpServer Helm chart to first master
  ansible.builtin.copy:
    src: "{{ jumpserver_chart_archive }}"
    dest: "{{ jumpserver_work_dir }}/{{ jumpserver_chart_archive }}"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Render JumpServer dependencies manifest
  ansible.builtin.template:
    src: dependencies.yaml.j2
    dest: "{{ jumpserver_work_dir }}/dependencies.yaml"
    mode: "0600"
  when: inventory_hostname == groups['masters'][0]

- name: Render JumpServer values.yaml
  ansible.builtin.template:
    src: values.yaml.j2
    dest: "{{ jumpserver_work_dir }}/values.yaml"
    mode: "0600"
  when: inventory_hostname == groups['masters'][0]

- name: Check kube-apiserver is reachable
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - --raw=/readyz
  register: apiserver_ready
  changed_when: false
  retries: 30
  delay: 5
  until: apiserver_ready.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Create JumpServer namespace
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - create
      - namespace
      - "{{ jumpserver_namespace }}"
  register: jumpserver_ns_create
  failed_when:
    - jumpserver_ns_create.rc != 0
    - "'AlreadyExists' not in jumpserver_ns_create.stderr"
  changed_when: jumpserver_ns_create.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Apply JumpServer builtin MySQL and Redis
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - -f
      - "{{ jumpserver_work_dir }}/dependencies.yaml"
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Wait for builtin MySQL
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ jumpserver_namespace }}"
      - rollout
      - status
      - statefulset/{{ jumpserver_mysql_name }}
      - --timeout=10m
  changed_when: false
  when:
    - inventory_hostname == groups['masters'][0]
    - jumpserver_builtin_mysql_enabled | bool
    - not (jumpserver_external_mysql_enabled | bool)

- name: Wait for builtin Redis
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ jumpserver_namespace }}"
      - rollout
      - status
      - statefulset/{{ jumpserver_redis_name }}
      - --timeout=10m
  changed_when: false
  when:
    - inventory_hostname == groups['masters'][0]
    - jumpserver_builtin_redis_enabled | bool
    - not (jumpserver_external_redis_enabled | bool)

- name: Install or upgrade JumpServer via Helm
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - "{{ jumpserver_release_name }}"
      - "{{ jumpserver_work_dir }}/{{ jumpserver_chart_archive }}"
      - --namespace
      - "{{ jumpserver_namespace }}"
      - -f
      - "{{ jumpserver_work_dir }}/values.yaml"
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - --timeout
      - "{{ jumpserver_helm_timeout }}"
      - --wait
  register: jumpserver_helm_result
  changed_when: "'has been upgraded' in jumpserver_helm_result.stdout or 'has been installed' in jumpserver_helm_result.stdout"
  when: inventory_hostname == groups['masters'][0]

- name: Show JumpServer Helm result
  ansible.builtin.debug:
    msg: "{{ jumpserver_helm_result.stdout_lines | default([]) }}"
  when: inventory_hostname == groups['masters'][0]

- name: Show JumpServer pods
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ jumpserver_namespace }}"
      - get
      - pods
      - -o
      - wide
  register: jumpserver_pods
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print JumpServer pods
  ansible.builtin.debug:
    msg: "{{ jumpserver_pods.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]

- name: Show JumpServer PVCs
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ jumpserver_namespace }}"
      - get
      - pvc
      - -o
      - wide
  register: jumpserver_pvcs
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print JumpServer PVCs
  ansible.builtin.debug:
    msg: "{{ jumpserver_pvcs.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]

- name: Show JumpServer services
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - -n
      - "{{ jumpserver_namespace }}"
      - get
      - svc
      - -o
      - wide
  register: jumpserver_svc
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print JumpServer services
  ansible.builtin.debug:
    msg: "{{ jumpserver_svc.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]
