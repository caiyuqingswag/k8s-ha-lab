- name: Check if Kubernetes already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: adminconf

- name: Render kubeadm.yaml
  ansible.builtin.template:
    src: kubeadm.yaml.j2
    dest: /etc/kubernetes/kubeadm.yaml
    mode: "0644"
  when:
    - inventory_hostname == groups['masters'][0]
    - not adminconf.stat.exists

- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --config=/etc/kubernetes/kubeadm.yaml
    --skip-phases=addon/kube-proxy
  register: kubeadm_init
  when:
    - inventory_hostname == groups['masters'][0]
    - not adminconf.stat.exists

- name: Re-check admin.conf after init
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: adminconf_after
  when:
    - inventory_hostname == groups['masters'][0]
    - kubeadm_init is defined
    - kubeadm_init.changed

- name: Ensure /root/.kube exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists

- name: Install admin kubeconfig for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists

- name: Ensure ~/.kube exists for ansible user
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    owner: "{{ ansible_user_uid }}"
    group: "{{ ansible_user_gid }}"
    mode: "0700"
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists

- name: Install admin kubeconfig for ansible user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user_uid }}"
    group: "{{ ansible_user_gid }}"
    mode: "0600"
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists

- name: Switch kube-vip kubeconfig to admin.conf
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/kube-vip.yaml
    regexp: 'path:\s*/etc/kubernetes/super-admin\.conf'
    replace: 'path: /etc/kubernetes/admin.conf'
  when:
    - inventory_hostname == groups['masters'][0]
    - kubeadm_init is defined
    - kubeadm_init.changed

- name: Upload certs and get certificate-key
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: upload_certs
  changed_when: false
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists

- name: Get join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists

- name: Assert join command uses VIP endpoint
  ansible.builtin.assert:
    that:
      - kube_vip_address ~ ':' ~ kube_vip_port in join_cmd.stdout
    fail_msg: |
      Join command does not use VIP endpoint!
      Expected: {{ kube_vip_address }}:{{ kube_vip_port }}
      Got:
      {{ join_cmd.stdout }}
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists

- name: Save cluster join info globally
  ansible.builtin.add_host:
    name: k8s_cluster
    join_command: "{{ join_cmd.stdout | mandatory }}"
    certificate_key: "{{ upload_certs.stdout_lines | last | mandatory }}"
  when:
    - inventory_hostname == groups['masters'][0]
    - adminconf_after.stat.exists