---
# =========================
# Apply APISIXRoute for platform web UIs
# Run from first master only
# =========================

- name: Ensure this role runs with cluster access
  ansible.builtin.assert:
    that:
      - groups['masters'] is defined
      - groups['masters'] | length > 0
    fail_msg: "masters group is required."

- name: Ensure APISIX routes working directory exists
  ansible.builtin.file:
    path: "{{ apisix_routes_work_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname == groups['masters'][0]

- name: Render APISIX UI routes
  ansible.builtin.template:
    src: apisix-ui-routes.yaml.j2
    dest: "{{ apisix_routes_work_dir }}/apisix-ui-routes.yaml"
    mode: "0644"
  when: inventory_hostname == groups['masters'][0]

- name: Check kube-apiserver is reachable
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - --raw=/readyz
  register: apiserver_ready
  changed_when: false
  retries: 30
  delay: 5
  until: apiserver_ready.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Ensure route namespaces exist
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - create
      - namespace
      - "{{ item }}"
  loop: "{{ apisix_ui_routes | map(attribute='namespace') | unique | list }}"
  register: route_ns_create
  failed_when:
    - route_ns_create.rc != 0
    - "'AlreadyExists' not in route_ns_create.stderr"
  changed_when: route_ns_create.rc == 0
  when: inventory_hostname == groups['masters'][0]

- name: Apply APISIX UI routes
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - -f
      - "{{ apisix_routes_work_dir }}/apisix-ui-routes.yaml"
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Show APISIX routes
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - get
      - apisixroute
      - -A
  register: apisix_routes_result
  changed_when: false
  when: inventory_hostname == groups['masters'][0]

- name: Print APISIX routes
  ansible.builtin.debug:
    msg: "{{ apisix_routes_result.stdout_lines }}"
  when: inventory_hostname == groups['masters'][0]
