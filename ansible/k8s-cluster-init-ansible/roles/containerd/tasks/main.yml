---
# =========================
# Remove Ubuntu default containerd
# =========================

- name: Remove distro containerd (Ubuntu)
  apt:
    name: containerd
    state: absent
    purge: true
  ignore_errors: true

# =========================
# Docker CE repo (Aliyun)
# =========================

- name: Install apt prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Ensure apt keyrings dir exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker CE GPG key (Aliyun)
  get_url:
    url: https://mirrors.aliyun.com/docker-ce/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker CE repo (Aliyun)
  apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://mirrors.aliyun.com/docker-ce/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker-ce
    state: present

# =========================
# Install containerd.io
# =========================

- name: Install containerd.io
  apt:
    name: containerd.io
    state: present
    update_cache: true

# =========================
# Install crictl
# =========================

- name: Copy crictl archive
  copy:
    src: crictl-v1.34.0-linux-amd64.tar.gz
    dest: /tmp/crictl.tar.gz
    mode: "0644"

- name: Extract crictl
  unarchive:
    src: /tmp/crictl.tar.gz
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/crictl

- name: Ensure crictl executable
  file:
    path: /usr/local/bin/crictl
    mode: "0755"

# =========================
# containerd directories
# =========================

- name: Ensure containerd dirs
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/containerd
    - /etc/containerd/certs.d

# =========================
# containerd config
# =========================

- name: Deploy containerd config.toml
  copy:
    src: config.toml
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

# =========================
# Registry mirrors
# =========================

- name: Create registry mirror dirs
  file:
    path: "/etc/containerd/certs.d/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - docker.io
    - registry.k8s.io
    - gcr.io
    - ghcr.io
    - quay.io

- name: Configure docker.io mirror
  copy:
    dest: /etc/containerd/certs.d/docker.io/hosts.toml
    mode: "0644"
    content: |
      server = "https://docker.io"
      [host."https://docker.m.daocloud.io"]
        capabilities = ["pull", "resolve"]
  notify: Restart containerd

- name: Configure registry.k8s.io mirror
  copy:
    dest: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    mode: "0644"
    content: |
      server = "https://registry.k8s.io"
      [host."https://docker.m.daocloud.io"]
        capabilities = ["pull", "resolve"]
  notify: Restart containerd

# =========================
# crictl config
# =========================

- name: Configure crictl
  copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false

# =========================
# 🔴 关键：立刻应用 containerd 配置
# =========================

- name: Apply containerd config immediately
  meta: flush_handlers

- name: Wait for containerd socket
  wait_for:
    path: /run/containerd/containerd.sock
    state: present
    timeout: 30

# =========================
# Enable & verify
# =========================

- name: Enable and start containerd
  systemd:
    name: containerd
    enabled: true
    state: started

- name: Verify containerd version
  command: containerd --version
  changed_when: false

- name: Verify crictl
  command: crictl --version
  changed_when: false
