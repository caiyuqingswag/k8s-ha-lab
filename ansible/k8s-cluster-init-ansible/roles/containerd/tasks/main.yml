---
# =========================
# Remove Ubuntu default containerd
# =========================

- name: Remove distro containerd (Ubuntu)
  ansible.builtin.apt:
    name: containerd
    state: absent
    purge: true
  ignore_errors: true

# =========================
# Docker CE repo (Aliyun - Ubuntu)
# =========================

- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Ensure apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker CE GPG key (Aliyun)
  ansible.builtin.get_url:
    url: https://mirrors.aliyun.com/docker-ce/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker CE repo (Aliyun, Ubuntu)
  ansible.builtin.apt_repository:
    repo: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://mirrors.aliyun.com/docker-ce/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker-ce
    state: present

# =========================
# Install containerd.io 2.x
# =========================

- name: Install containerd.io (Docker CE)
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true

# =========================
# Install crictl
# =========================

- name: Copy crictl package
  ansible.builtin.copy:
    src: crictl-v1.34.0-linux-amd64.tar.gz
    dest: /tmp/crictl.tar.gz
    mode: "0644"

- name: Extract crictl
  ansible.builtin.unarchive:
    src: /tmp/crictl.tar.gz
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/crictl

- name: Ensure crictl executable
  ansible.builtin.file:
    path: /usr/local/bin/crictl
    mode: "0755"

# =========================
# containerd directories
# =========================

- name: Ensure containerd dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/containerd
    - /etc/containerd/certs.d

# =========================
# containerd config (2.x)
# =========================

- name: Deploy containerd config.toml
  ansible.builtin.copy:
    src: config.toml
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

# =========================
# Registry mirrors (certs.d)
# =========================

- name: Create certs.d directories
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - docker.io
    - registry.k8s.io
    - gcr.io
    - ghcr.io
    - quay.io

- name: Configure docker.io registry mirrors
  ansible.builtin.copy:
    dest: /etc/containerd/certs.d/docker.io/hosts.toml
    mode: "0644"
    content: |
      server = "https://docker.io"

      [host."https://docker.m.daocloud.io"]
        capabilities = ["pull", "resolve"]

      [host."https://ccr.ccs.tencentyun.com"]
        capabilities = ["pull", "resolve"]

      [host."https://docker.1ms.run"]
        capabilities = ["pull", "resolve"]

      [host."https://dhub.kubesre.xyz"]
        capabilities = ["pull", "resolve"]

      [host."https://docker.kejilion.pro"]
        capabilities = ["pull", "resolve"]

      [host."https://docker.xuanyuan.me"]
        capabilities = ["pull", "resolve"]

      [host."https://docker.hlmirror.com"]
        capabilities = ["pull", "resolve"]

      [host."https://docker.melikeme.cn"]
        capabilities = ["pull", "resolve"]
  notify: Restart containerd

- name: Configure registry.k8s.io mirror
  ansible.builtin.copy:
    dest: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    mode: "0644"
    content: |
      server = "https://registry.k8s.io"

      [host."https://docker.m.daocloud.io"]
        capabilities = ["pull", "resolve"]
  notify: Restart containerd

- name: Configure gcr.io mirror
  ansible.builtin.copy:
    dest: /etc/containerd/certs.d/gcr.io/hosts.toml
    mode: "0644"
    content: |
      server = "https://gcr.io"

      [host."https://docker.m.daocloud.io"]
        capabilities = ["pull", "resolve"]
  notify: Restart containerd

- name: Configure ghcr.io mirror
  ansible.builtin.copy:
    dest: /etc/containerd/certs.d/ghcr.io/hosts.toml
    mode: "0644"
    content: |
      server = "https://ghcr.io"

      [host."https://docker.m.daocloud.io"]
        capabilities = ["pull", "resolve"]
  notify: Restart containerd

- name: Configure quay.io mirror
  ansible.builtin.copy:
    dest: /etc/containerd/certs.d/quay.io/hosts.toml
    mode: "0644"
    content: |
      server = "https://quay.io"

      [host."https://docker.m.daocloud.io"]
        capabilities = ["pull", "resolve"]
  notify: Restart containerd

# =========================
# crictl config
# =========================

- name: Configure crictl
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false

# =========================
# journald tuning
# =========================

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Ensure persistent journal dir exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    mode: "0755"

- name: Configure journald log rotation
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-k8s.conf
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
      SystemKeepFree=2G
      SystemMaxFileSize=100M
      MaxRetentionSec=30day
      MaxFileSec=7day
  notify: Restart journald

# =========================
# Enable & verify
# =========================

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Verify containerd version
  ansible.builtin.command: containerd --version
  changed_when: false

- name: Verify crictl
  ansible.builtin.command: crictl version
  changed_when: false
