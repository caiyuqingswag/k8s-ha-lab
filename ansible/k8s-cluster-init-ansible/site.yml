---
# =========================
# 1. System update and kernel upgrade
# =========================

- name: System update and kernel upgrade
  hosts: all
  become: true
  roles:
    - system_update
  tags:
    - update

# =========================
# 2. Common OS init
# =========================

- name: Common OS init
  hosts: all
  become: true
  roles:
    - common
  tags:
    - common

# =========================
# 3. Install container runtime
# =========================

- name: Install containerd
  hosts: all
  become: true
  roles:
    - containerd
  tags:
    - containerd

# =========================
# 4. Install Kubernetes packages
# =========================

- name: Install kubelet kubeadm kubectl
  hosts: all
  become: true
  roles:
    - kube
  tags:
    - kube

# =========================
# 5. Deploy kube-vip on first master before kubeadm init
# master1-vip 使用 /etc/kubernetes/super-admin.conf
# =========================

- name: Deploy kube-vip for first control-plane node
  hosts: master1-vip
  become: true
  roles:
    - kube-vip
  tags:
    - kubevip
    - init

# =========================
# 6. Kubeadm init on first master
# =========================

- name: Kubeadm init on first master
  hosts: "{{ groups['masters'][0] }}"
  become: true
  serial: 1
  tasks:
    - name: Init first control-plane node
      ansible.builtin.import_role:
        name: kubeadm
        tasks_from: init.yml
  tags:
    - init

# =========================
# 7. Switch kube-vip on first master to admin.conf
# =========================

- name: Switch kube-vip on first master to admin.conf
  hosts: master1-vip
  become: true
  tasks:
    - name: Switch kube-vip kubeconfig to admin.conf
      ansible.builtin.import_role:
        name: kube-vip
        tasks_from: use-admin-conf.yml
  tags:
    - kubevip
    - init

# =========================
# 8. Install CLI tools on first master
# =========================

- name: Install CLI tools
  hosts: "{{ groups['masters'][0] }}"
  become: true
  roles:
    - cli-tools
  tags:
    - cli

# =========================
# 9. Deploy Cilium CNI
# =========================

- name: Deploy Cilium CNI
  hosts: "{{ groups['masters'][0] }}"
  become: true
  tasks:
    - name: Install Cilium
      ansible.builtin.import_role:
        name: cni
  tags:
    - cilium

# =========================
# 10. Join other masters first
# 注意：先 join，join 成功后其他 master 才会生成 /etc/kubernetes/admin.conf
# =========================

- name: Join other masters
  hosts: othermaster-vip
  become: true
  serial: 1
  tasks:
    - name: Join control-plane node
      ansible.builtin.import_role:
        name: kubeadm
        tasks_from: join_masters.yml
  tags:
    - join_masters

# =========================
# 11. Deploy kube-vip on other masters after join
# othermaster-vip 使用 /etc/kubernetes/admin.conf
# =========================

- name: Deploy kube-vip for other control-plane nodes
  hosts: othermaster-vip
  become: true
  roles:
    - kube-vip
  tags:
    - kubevip
    - join_masters

# =========================
# 12. Join workers
# =========================

- name: Join workers
  hosts: nodes
  become: true
  serial: 3
  tasks:
    - name: Join worker node
      ansible.builtin.import_role:
        name: kubeadm
        tasks_from: join_workers.yml
  tags:
    - join_workers

# =========================
# 13. Deploy kube-vip LoadBalancer
# 先不启用
# =========================

