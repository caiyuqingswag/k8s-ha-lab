- name: System update and kernel upgrade (parallel)
  hosts: all
  become: true
  strategy: free
  roles:
    - system_update
  tags:
    - update

- name: Generate summary report on control node (txt table)
  hosts: localhost
  gather_facts: false
  vars:
    system_update_report_dir: "{{ hostvars[groups['masters'][0]].system_update_report_dir | default('./upgrade-reports') }}"
  tasks:
    - name: Ensure report directory exists
      file:
        path: "{{ system_update_report_dir }}"
        state: directory
        mode: "0755"

    - name: Write summary.txt
      template:
        src: roles/system_update/templates/summary.j2
        dest: "{{ system_update_report_dir }}/summary.txt"
        mode: "0644"
  tags:
    - update

- name: Reboot control node last (delayed, so ansible can finish)
  hosts: "{{ groups['masters'][0] }}"
  become: true
  gather_facts: false
  tasks:
    - name: Schedule delayed reboot on control node if needed
      command: "systemd-run --on-active={{ system_update_control_reboot_delay_seconds | default(60) }}s /usr/sbin/reboot"
      when:
        - system_update_reboot | default(true)
        - reboot_needed | default(false)
  tags:
    - update

- name: Common OS init (all)
  hosts: all
  become: true
  roles:
    - common
  tags: common

#- name: Deploy Nginx + Keepalived LB
#  hosts: lb_master,lb_backup
#  become: true
#  roles:
#    - lb
#  tags: lb

- name: Install containerd (all)
  hosts: all
  become: true
  roles:
    - containerd
  tags: containerd

- name: Install kubelet/kubeadm/kubectl (all)
  hosts: all
  become: true
  roles:
    - kube
  tags: kube

- name: Deploy kube-vip (control-plane VIP) on all masters
  hosts: masters
  become: true
  roles:
    - kube-vip
  tags: kubevip

- name: Kubeadm init on master1
  hosts: "{{ groups['masters'][0] }}"
  become: true
  serial: 1
  tasks:
    - import_role:
        name: kubeadm
        tasks_from: init.yml
#    - import_role:
#        name: cni
  tags: init

- name: Install CLI tools (kubectl completion, helm)
  hosts: "{{ groups['masters'][0] }}"
  become: true
  roles:
    - cli-tools
  tags:
    - cli

- name: Deploy Cilium CNI (kube-proxy replacement)
  hosts: "{{ groups['masters'][0] }}"
  become: true
  tasks:
    - import_role:
        name: cni
  tags:
    - cilium

- name: Deploy kube-vip LoadBalancer (Service type=LoadBalancer)
  hosts: "{{ groups['masters'][0] }}"
  become: true
  tasks:
    - import_role:
        name: kube-vip-loadbalance
  tags:
    - kubevip-lb

- name: Join other masters (control-plane)
  hosts: masters
  become: true
  serial: 1
  tasks:
    - import_role:
        name: kubeadm
        tasks_from: join_masters.yml
  tags: join_masters

- name: Join workers
  hosts: nodes
  become: true
  serial: 10
  tasks:
    - import_role:
        name: kubeadm
        tasks_from: join_workers.yml
  tags: join_workers

- name: Deploy NFS server
  hosts: nfs-server
  become: true
  roles:
    - nfs-server
  tags:
    - nfs

- name: Init directories on NFS server
  hosts: nfs-server
  become: true
  roles:
    - dirs
  tags:
    - dir
